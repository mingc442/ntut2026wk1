<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>今日的幸運四葉草</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background-color: #f7f9f6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
      color: #333;
    }

    h1 {
      font-size: 20px;
      font-weight: 500;
      margin-bottom: 24px;
      color: #3e5c45;
    }

    /* 幸運草容器 */
    .clover-area {
      position: relative;
      width: 140px;
      height: 160px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      margin-bottom: 20px;
    }

    .clover-head {
      position: absolute;
      top: 10px;
      width: 120px;
      height: 120px;
      z-index: 2;
    }

    /* 葉片樣式與預設旋轉角度 */
    .leaf {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 48px;
      height: 52px;
      margin-left: -24px;
      margin-top: -46px; /* 葉尖靠緊中心 */
      transform-origin: 24px 46px; /* 以中心為旋轉基準點 */
      transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.4s ease;
      fill: #6fab7b;
    }

    .leaf-1 { transform: rotate(0deg); }
    .leaf-2 { transform: rotate(90deg); }
    .leaf-3 { transform: rotate(180deg); }
    .leaf-4 { transform: rotate(270deg); }

    /* 摘下飄落效果 */
    .leaf.plucked {
      opacity: 0 !important;
      pointer-events: none;
      transform: translateY(40px) rotate(35deg) scale(0.4) !important;
    }

    /* 葉柄 */
    .stem {
      position: absolute;
      bottom: 12px;
      left: 50%;
      width: 32px;
      height: 55px;
      margin-left: -2px;
      border-left: 3.5px solid #5a9465;
      border-radius: 0 0 0 28px;
      z-index: 1;
    }

    /* 籤詩文字 */
    .message {
      font-size: 15px;
      color: #555;
      min-height: 24px;
      margin-bottom: 28px;
      text-align: center;
      padding: 0 16px;
    }

    /* 按鈕 */
    button {
      padding: 9px 22px;
      font-size: 14px;
      color: #3e5c45;
      background: #ffffff;
      border: 1.5px solid #6fab7b;
      border-radius: 20px;
      cursor: pointer;
      transition: background-color 0.15s ease, transform 0.1s ease;
    }

    button:hover {
      background: #eef5f0;
    }

    button:active {
      transform: scale(0.96);
    }
  </style>
</head>
<body>

  <h1>🍀 摘下一片四葉草</h1>

  <div class="clover-area" onclick="pluckLeaf()">
    <div class="clover-head">
      <!-- 葉片 1 -->
      <svg class="leaf leaf-1" id="leaf-1" viewBox="0 0 40 40">
        <path d="M20 38 C20 38 4 26 4 14 A10 10 0 0 1 20 10 A10 10 0 0 1 36 14 C36 26 20 38 20 38 Z" />
      </svg>
      <!-- 葉片 2 -->
      <svg class="leaf leaf-2" id="leaf-2" viewBox="0 0 40 40">
        <path d="M20 38 C20 38 4 26 4 14 A10 10 0 0 1 20 10 A10 10 0 0 1 36 14 C36 26 20 38 20 38 Z" />
      </svg>
      <!-- 葉片 3 -->
      <svg class="leaf leaf-3" id="leaf-3" viewBox="0 0 40 40">
        <path d="M20 38 C20 38 4 26 4 14 A10 10 0 0 1 20 10 A10 10 0 0 1 36 14 C36 26 20 38 20 38 Z" />
      </svg>
      <!-- 葉片 4 -->
      <svg class="leaf leaf-4" id="leaf-4" viewBox="0 0 40 40">
        <path d="M20 38 C20 38 4 26 4 14 A10 10 0 0 1 20 10 A10 10 0 0 1 36 14 C36 26 20 38 20 38 Z" />
      </svg>
    </div>
    <div class="stem"></div>
  </div>

  <div class="message" id="msg">點一下四葉草，摘下一瓣好運。</div>

  <button onclick="pluckLeaf()">摘一片葉子</button>

  <script>
    const lucks = [
      "今天會遇到一件微小但開心的事情。",
      "等公車或捷運時，車剛好要進站。",
      "買飲料或便當時剛好不用排隊。",
      "今晚會睡得特別沉、特別香甜。",
      "卡住很久的想法，今天突然有了新靈感。",
      "今天你的能量狀態：平靜又順遂度過一天！"
    ];

    let availableLeaves = [1, 2, 3, 4];
    let isRegrowing = false;

    function pluckLeaf() {
      if (isRegrowing) return;

      const msg = document.getElementById('msg');

      if (availableLeaves.length > 0) {
        const randomIndex = Math.floor(Math.random() * availableLeaves.length);
        const leafNum = availableLeaves.splice(randomIndex, 1)[0];
        
        const leafEl = document.getElementById(`leaf-${leafNum}`);
        leafEl.classList.add('plucked');

        const randomText = lucks[Math.floor(Math.random() * lucks.length)];
        msg.textContent = randomText;

        if (availableLeaves.length === 0) {
          isRegrowing = true;
          setTimeout(() => {
            msg.textContent = "四葉草正在長出新芽...";
            regrowClover();
          }, 800);
        }
      }
    }

    function regrowClover() {
      const msg = document.getElementById('msg');
      
      [1, 2, 3, 4].forEach((num, index) => {
        setTimeout(() => {
          const leafEl = document.getElementById(`leaf-${num}`);
          leafEl.classList.remove('plucked');

          if (index === 3) {
            availableLeaves = [1, 2, 3, 4];
            isRegrowing = false;
            msg.textContent = "好運重新聚集，可以再摘一片了！";
          }
        }, (index + 1) * 180);
      });
    }
  </script>

</body>
</html>
